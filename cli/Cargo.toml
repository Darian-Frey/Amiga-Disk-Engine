[package]
name = "ade-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ADE: command-line front-end"

[dependencies]
ade-core = { workspace = true }
[dev-dependencies]
ade-fixtures = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "ade"
path = "src/main.rs"
# Not documented by `cargo doc` (IMP-013). This binary and the C bridge's
# library are both named `ade`, so both wrote target/doc/ade/ in parallel and
# one deleted the directory under the other — cargo#6313, and a CI failure on
# 2026-10-22. A binary's rustdoc is never read; the bridge's is the API.
doc = false
