name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The toolchain comes from rust-toolchain.toml, which is pinned. rustup
      # installs it automatically on first use.
      - name: Show toolchain
        run: rustc --version && cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      # The lint set is not cosmetic: `unsafe_code` is forbidden (D-006), raw
      # byte-order conversions outside ade-endian are rejected (C-001), and the
      # panic-adjacent lints enforce "no crash on hostile input" (F-001).
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      # The C ABI, compiled and run as C (D-001). `cargo test` exercises the
      # bridge from Rust, which cannot catch the header disagreeing with the
      # library — only a real C compiler reading ade.h can. Built with
      # -Werror and run under AddressSanitizer, because a C ABI is the one
      # place in ADE where a memory bug is possible at all.
      - name: C ABI (header agreement, ASan)
        run: |
          cargo build --release -p ade-bridge
          cc -Wall -Wextra -Werror -g -fsanitize=address,undefined \
             -o /tmp/ade-smoke bridge/tests/smoke.c \
             target/release/libade.a -lpthread -ldl -lm
          cargo run --quiet -p ade-fixtures --bin mkfixture /tmp/ade-fixture.adf
          # The second argument is a folder to extract into (F-024): the run
          # writes it, then runs again over the same folder to check that
          # nothing is overwritten.
          ASAN_OPTIONS=detect_leaks=1 /tmp/ade-smoke /tmp/ade-fixture.adf /tmp/ade-unpacked /tmp/ade-made.adf
          # Again as a hard disk: a device holds no volume of its own, so it
          # exercises the partition calls and nothing else does (F-018).
          cargo run --quiet -p ade-fixtures --bin mkfixture /tmp/ade-device.hdf --device
          ASAN_OPTIONS=detect_leaks=1 /tmp/ade-smoke /tmp/ade-device.hdf /tmp/ade-unpacked-hdf

      # The Qt6 front end (F-004). Headless: what the window *shows* needs no
      # display, and only how it *feels* needs a person.
      - name: Install Qt6
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev cmake

      - name: GUI build and tests
        run: |
          cmake -S gui -B gui/build -DCMAKE_BUILD_TYPE=Release
          cmake --build gui/build
          QT_QPA_PLATFORM=offscreen ctest --test-dir gui/build --output-on-failure

      # D-002's oracle, over fixtures ADE generates rather than a corpus it
      # cannot commit (D-010, amended 2026-08-24). ADFlib reads any structurally
      # valid volume regardless of who wrote it, so this puts an independent
      # implementation in the loop on every push — checking the generator as
      # well as the parser. What it cannot check is what SPEC omits; that is
      # the corpus's job, and the corpus is not here.
      - name: Install the D-002 oracle
        run: sudo apt-get update -qq && sudo apt-get install -y unadf

      - name: Differential check against ADFlib (D-002)
        run: cargo test -p ade-core --test oracle_fixtures

      # F-001's acceptance bar. Runs on every push at modest iteration counts;
      # a deep sweep is `ADE_FUZZ_ITERS=150000 cargo test --release --test fuzz`.
      #
      # Caveat worth knowing (IMP-003): a regression in the traversal cycle
      # detection would exhaust this runner's memory rather than fail cleanly,
      # because the harness asserts on a result the broken code never returns.
      - name: Fuzz the parse paths (F-001)
        run: cargo test -p ade-core --test fuzz

      - name: Docs build without warnings
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  layering:
    name: Layering (D-003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No module may span two pipeline layers. Adding a cross-layer dependency
      # must be a deliberate edit to the policy file, not an unnoticed line in a
      # Cargo.toml.
      - name: Check the crate dependency graph
        run: python3 tools/check-layering.py

  # Non-blocking: warns when the pinned toolchain has fallen behind stable, so
  # a version bump is scheduled rather than arriving as a broken build.
  toolchain-drift:
    name: Drift from latest stable
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install latest stable
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Lint against latest stable
        run: cargo +stable clippy --workspace --all-targets -- -D warnings
