# C-001 — all Amiga on-disk data is 68k big-endian; the host is little-endian,
# and every conversion routes through the `ade-endian` crate. These lints make
# that invariant enforceable rather than merely documented: `ade-endian` itself
# opts out with a targeted #[allow], so any other crate reaching for a raw
# byte-order conversion fails the build.
#
# The little-endian entries were added 2026-08-28 with SCP, the first format
# ADE reads that is not Amiga-authored. Until then nothing was little-endian,
# so nothing disallowed `from_le_bytes` — a hole in the tripwire that only
# opened when a use for it appeared. A format using *both* orders is exactly
# the case where an implicit conversion does not fail but silently returns a
# number a thousand times too large.
disallowed-methods = [
    { path = "u16::from_be_bytes", reason = "C-001: use ade-endian" },
    { path = "u32::from_be_bytes", reason = "C-001: use ade-endian" },
    { path = "u64::from_be_bytes", reason = "C-001: use ade-endian" },
    { path = "i16::from_be_bytes", reason = "C-001: use ade-endian" },
    { path = "i32::from_be_bytes", reason = "C-001: use ade-endian" },
    { path = "u16::to_be_bytes",   reason = "C-001: use ade-endian" },
    { path = "u32::to_be_bytes",   reason = "C-001: use ade-endian" },
    { path = "u64::to_be_bytes",   reason = "C-001: use ade-endian" },
    { path = "i16::to_be_bytes",   reason = "C-001: use ade-endian" },
    { path = "i32::to_be_bytes",   reason = "C-001: use ade-endian" },
    { path = "u16::from_be", reason = "C-001: use ade-endian" },
    { path = "u32::from_be", reason = "C-001: use ade-endian" },
    { path = "u64::from_be", reason = "C-001: use ade-endian" },
    { path = "u16::from_le_bytes", reason = "C-001: use ade-endian" },
    { path = "u32::from_le_bytes", reason = "C-001: use ade-endian" },
    { path = "u64::from_le_bytes", reason = "C-001: use ade-endian" },
    { path = "i16::from_le_bytes", reason = "C-001: use ade-endian" },
    { path = "i32::from_le_bytes", reason = "C-001: use ade-endian" },
    { path = "u16::to_le_bytes",   reason = "C-001: use ade-endian" },
    { path = "u32::to_le_bytes",   reason = "C-001: use ade-endian" },
    { path = "u16::from_le", reason = "C-001: use ade-endian" },
    { path = "u32::from_le", reason = "C-001: use ade-endian" },
    { path = "u64::from_le", reason = "C-001: use ade-endian" },
]
