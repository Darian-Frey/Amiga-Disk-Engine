[package]
name = "ade-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ADE: C ABI over the core engine, for the Qt6 GUI (D-001)"

[lib]
name = "ade"
# Both, deliberately: a shared library for the GUI to link at run time, and a
# static one so a C test can be built without an install step.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ade-core = { workspace = true }

[dev-dependencies]
ade-fixtures = { workspace = true }

# NOT `workspace = true`. The workspace *forbids* `unsafe_code`, and `forbid`
# cannot be lifted by an inner `allow` — that is the point of it. This crate is
# the one place a C ABI has to be written, so it opts out of the workspace set
# and restates every other lint verbatim. The exemption is therefore visible
# here rather than weakened for everyone (D-001, D-006).
[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
large_stack_arrays = "deny"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
